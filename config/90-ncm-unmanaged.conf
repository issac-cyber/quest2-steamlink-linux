# Keep NetworkManager from managing Quest NCM (cdc_ncm) interfaces.
#
# NCM interfaces are renamed to enx<mac> by udev. When NM auto-activates a
# profile on them, the profile has no never-default setting, so NM takes the
# default route and the PC loses internet for as long as the cable is in.
#
# Marking them unmanaged means NM never touches them: no default-route theft,
# no profile fights. The interface is brought up by 90-ncm-up.rules (udev)
# and kept up by ncm-up.service (3s self-heal loop).
[main]
unmanaged-devices=interface-name:enx*
